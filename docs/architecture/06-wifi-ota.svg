e="#0b7f8c" stroke-width="3.16" stroke-linecap="round" stroke-linejoin="round"><path d="M-30,-4 L-35,-13 M30,-4 L35,-13"/><rect x="-30" y="-9" width="25" height="19" rx="7" fill="#ffffff"/><rect x="5" y="-9" width="25" height="19" rx="7" fill="#ffffff"/><path d="M-5,-3 Q0,-8 5,-3"/><circle cx="0" cy="-14" r="3" fill="#0b7f8c" stroke="none"/></g><text x="1420" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#152840" font-weight="700" text-anchor="middle">Kính hỏi</text><text x="1420" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5a6b80" font-weight="400" text-anchor="middle">lúc khởi động · mỗi 6 giờ</text><path d="M938,260 L1110,260" fill="none" stroke="#8a98aa" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#m-line)"/><text x="1024" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a6b80" font-weight="600" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke" stroke-linejoin="round">phát hành</text><path d="M1382,260 L1190,260" fill="none" stroke="#0b7f8c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#m-glass)"/><text x="1286" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0b7f8c" font-weight="600" text-anchor="middle" stroke="#f6f8fc" stroke-width="5" paint-order="stroke" stroke-linejoin="round">GET manifest</text><rect x="1324.0" y="368.6" width="192.0" height="22.8" rx="11.4" fill="#e1f2f3" stroke="#0b7f8c" stroke-width="1"/><text x="1420" y="384.32" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#0b7f8c" font-weight="600" text-anchor="middle">hoặc POST /ota/pull (LAN)</text><path d="M1420,400 L1420,470 L1535,470 L1535,520" fill="none" stroke="#0b7f8c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#m-glass)"/><text x="1478" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0b7f8c" font-weight="600" text-anchor="middle" stroke="#f6f8fc" stroke-width="5" paint-order="stroke" stroke-linejoin="round">version khác</text><circle cx="1535" cy="560" r="32.3" fill="#e1f2f3"/><g transform="translate(1535 560) scale(0.95)" fill="none" stroke="#0b7f8c" stroke-width="3.16" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-18 V8 M-10,-2 L0,8 L10,-2 M-18,12 V18 H18 V12"/></g><text x="1535" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#152840" font-weight="700" text-anchor="middle">Tải /firmware/bin</text><circle cx="1330" cy="560" r="32.3" fill="#e1f2f3"/><g transform="translate(1330 560) scale(0.95)" fill="none" stroke="#0b7f8c" stroke-width="3.16" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-20 L17,-13 V0 Q17,14 0,20 Q-17,14 -17,0 V-13 Z" fill="#ffffff"/><path d="M-8,0 L-2,7 L9,-6"/></g><text x="1330" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#152840" font-weight="700" text-anchor="middle">Kiểm SHA-256</text><circle cx="1125" cy="560" r="32.3" fill="#e1f2f3"/><g transform="translate(1125 560) scale(0.95)" fill="none" stroke="#0b7f8c" stroke-width="3.16" stroke-linecap="round" stroke-linejoin="round"><rect x="-15" y="-15" width="30" height="30" rx="3" fill="#ffffff"/><path d="M-8,-15 V-21 M-8,15 V21 M-15,-8 H-21 M15,-8 H21"/><path d="M0,-15 V-21 M0,15 V21 M-15,0 H-21 M15,0 H21"/><path d="M8,-15 V-21 M8,15 V21 M-15,8 H-21 M15,8 H21"/><path d="M0,-8 V6 M-6,0 L0,6 L6,0"/></g><text x="1125" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#152840" font-weight="700" text-anchor="middle">Ghi phân vùng OTA</text><circle cx="920" cy="560" r="32.3" fill="#e1f2f3"/><g transform="translate(920 560) scale(0.95)" fill="none" stroke="#0b7f8c" stroke-width="3.16" stroke-linecap="round" stroke-linejoin="round"><path d="M-15,-3 A15,15 0 0 1 12,-9 M7,-16 L12,-9 L4,-5 M15,3 A15,15 0 0 1 -12,9 M-7,16 L-12,9 L-4,5"/></g><text x="920" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#152840" font-weight="700" text-anchor="middle">Khởi động lại</text><path d="M1497,560 L1370,560" fill="none" stroke="#0b7f8c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#m-glass)"/><path d="M1292,560 L1165,560" fill="none" stroke="#0b7f8c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#m-glass)"/><path d="M1087,560 L960,560" fill="none" stroke="#0b7f8c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#m-glass)"/><text x="846" y="672" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5a6b80" font-weight="400" text-anchor="start">So version bằng != chứ không phải &gt; — cố ý, để rollback được bằng cách phát hành bản cũ.</text><text x="846" y="694" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5a6b80" font-weight="400" text-anchor="start">Chặn OTA khi vừa bấm nút trong 60 s. Bảng phân vùng phải là min_spiffs — chỉ ghi được qua USB.</text><text x="40" y="778" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5a6b80" font-weight="400" text-anchor="start">Nguồn: services/firmware.py, tools/publish_firmware.py, tools/ble_provision.py, CLAUDE.md   ·   11/09/2026</text></svg>