 font-weight="600" text-anchor="start">kéo manifest → OTA</text><path d="M800,422 L800,462" fill="none" stroke="#0b7f8c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#m-glass)"/><text x="56" y="780" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5a6b80" font-weight="400" text-anchor="start">Cache-Control: no-store — kênh đi qua Cloudflare, một lượt poll bị cache nghĩa là kính đọc mãi hộp thư cũ.</text><rect x="940" y="140" width="690" height="670" rx="14" fill="#ffffff" stroke="#dbe2ec" stroke-width="1.5"/><text x="966" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c0392b" font-weight="700" text-anchor="start">VÌ SAO demo1 TẮT NÓ — khối RAM liền lớn nhất trên ESP32 (đo trên board)</text><text x="966" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#152840" font-weight="600" text-anchor="start">khởi động</text><rect x="966" y="232" width="540.0" height="30" rx="6" fill="#0b7f8c" stroke="#0b7f8c" stroke-width="1.5"/><text x="1496.0" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="end">114 676 B</text><text x="966" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#152840" font-weight="600" text-anchor="start">sau MỘT phiên TLS</text><rect x="966" y="310" width="327.8349436673759" height="30" rx="6" fill="#0b7f8c" stroke="#0b7f8c" stroke-width="1.5"/><text x="1283.834943667376" y="331" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="end">69 620 B</text><text x="966" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#152840" font-weight="600" text-anchor="start">sau khi cấp phát audio</text><rect x="966" y="388" width="163.88921831943912" height="30" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/><text x="1119.8892183194391" y="409" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#ffffff" font-weight