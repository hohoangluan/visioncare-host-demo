" cy="687" r="17.0" fill="#e3f2ea"/><g transform="translate(982 687) scale(0.5)" fill="none" stroke="#23805a" stroke-width="5.00" stroke-linecap="round" stroke-linejoin="round"><circle r="19" fill="#ffffff"/><path d="M-8,0 L-2,7 L9,-6"/></g><text x="1006" y="692" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#152840" font-weight="400" text-anchor="start">OTA vẫn chạy: POST /ota/pull + hỏi mỗi 6 giờ</text><text x="966" y="780" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#5a6b80" font-weight="400" text-anchor="start">Đường ra chưa quyết: đẩy mbedtls sang PSRAM (6.16 MB liền) — phải rời Arduino IDE.</text><text x="40" y="838" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#5a6b80" font-weight="400" text-anchor="start">Nguồn: CLAUDE.md mục “nút thắt RAM”, app.py poll_downlink(), services/events_channel.py   ·   11/09/2026</text></svg>