[pytest]
markers =
    perf: ngân sách độ trễ (T21/G1). Ngưỡng TUYỆT ĐỐI, nhưng chỉ trên những
        đường KHÔNG gọi ra ngoài — chậm đi ở đó là hồi quy code thật, không
        phải mạng dở. Bảng p50/p95 đo bằng tools/measure_budget.py trên máy
        chuẩn, không đo trong CI (xem T21 mục 6 câu 3).
    llm: gọi Gemini thật. Cần khoá API và mạng, nên KHÔNG chạy trong CI.
        Chạy tay khi đụng tới prompt hoặc đổi model.
