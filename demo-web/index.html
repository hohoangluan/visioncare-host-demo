<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SeeVia Demo</title>
  <meta name="description" content="Kính gửi video và giọng nói lên server SeeVia, nghe lại câu trả lời của server.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%2326211d'/%3E%3Cpath d='M6 16s3.5-7 10-7 10 7 10 7-3.5 7-10 7S6 16 6 16Z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3Z"/><circle cx="12" cy="13" r="3"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  </defs>
</svg>

<main class="app">
  <div class="stage" id="stage" data-state="idle">
    <video id="video" playsinline muted></video>

    <div class="top">
      <div class="chip" role="status" aria-live="polite"><span class="chip-dot"></span><span id="chip-text">Sẵn sàng</span></div>
      <span class="chip chip-mock" id="mock-tag" hidden>Mô phỏng</span>
      <div class="top-right">
        <span class="chip"><span class="dot" id="server-dot" data-state="unknown"></span><span id="server-text">Đang kiểm tra server…</span></span>
        <button class="round" type="button" id="btn-settings" aria-label="Cài đặt"><svg class="i" aria-hidden="true"><use href="#i-sliders"/></svg></button>
      </div>
    </div>

    <div class="media-gate" id="media-gate" hidden>
      <svg class="i i-lg" aria-hidden="true"><use href="#i-camera"/></svg>
      <p id="media-gate-msg">Cần quyền camera và micro để bắt đầu.</p>
      <button class="cta cta-sm" type="button" id="btn-enable-media">Bật camera &amp; micro</button>
    </div>

    <div class="hud">
      <p class="note" id="note" role="alert" hidden></p>
      <button class="cta" type="button" id="cta" aria-pressed="false">
        <svg class="i" aria-hidden="true"><use id="cta-icon" href="#i-mic"/></svg>
        <span id="cta-text">Ghi âm</span>
      </button>
    </div>
  </div>
</main>

<dialog id="dlg-settings" aria-labelledby="dlg-settings-title">
  <form method="dialog" class="dlg">
    <div class="dlg-head">
      <h2 id="dlg-settings-title">Cài đặt</h2>
      <button class="round round-soft" type="button" data-close aria-label="Đóng"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>

    <fieldset>
      <legend>Chế độ</legend>
      <label class="opt"><input type="radio" name="mode" value="live"><span><b>Server thật</b><small>Gửi ảnh và giọng nói tới server SeeVia</small></span></label>
      <label class="opt"><input type="radio" name="mode" value="mock"><span><b>Mô phỏng</b><small>Giọng đọc soạn sẵn để tập dượt, không gọi server</small></span></label>
    </fieldset>

    <label class="field">
      <span>Đường dẫn server</span>
      <input type="text" id="set-base" inputmode="url" autocomplete="off" spellcheck="false" placeholder="/api">
      <small>Mặc định <code>/api</code> — do <code>serve.py</code> chuyển tiếp tới server kính.</small>
    </label>

    <label class="field">
      <span>Camera</span>
      <select id="set-facing">
        <option value="environment">Camera sau (hướng ra ngoài)</option>
        <option value="user">Camera trước</option>
      </select>
    </label>

    <label class="field">
      <span>Định dạng audio trả về</span>
      <select id="set-format">
        <option value="audio/mpeg">MP3 — phát ngay khi gói đầu tới</option>
        <option value="audio/wav">WAV — chờ trọn câu rồi mới phát</option>
      </select>
    </label>

    <div class="dlg-foot"><button class="cta cta-sm" value="save" id="set-save">Lưu</button></div>
  </form>
</dialog>

<audio id="player" preload="auto"></audio>
<script type="module" src="app.js"></script>
</body>
</html>
